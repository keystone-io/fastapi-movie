server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 주의: location 안에서 add_header 를 하나라도 쓰면 바깥(server) add_header 가
    # 상속되지 않는다. 그래서 보안 헤더를 각 location 에 직접 적는다.

    # API → FastAPI 컨테이너 (개발 환경의 Vite proxy 와 같은 역할)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        add_header X-Content-Type-Options nosniff always;
    }

    # 빌드 결과물(파일명에 해시 포함)은 오래 캐시
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # React Router: 없는 경로는 index.html 로 (새로고침 시 404 방지)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
